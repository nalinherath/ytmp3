<!DOCTYPE html>
<html lang="si">
<head>
    <meta name="google-site-verification" content="pDx_Z47Odh2PIKICzOyIc5pEz2-d3vUXo4eH9vIfdy4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SL Video to MP3 Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .converter-box {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }
        h2 { color: #e94560; margin-bottom: 10px; }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 20px 0;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background-color: #0f3460; }
        #status-message {
            margin-top: 25px;
            min-height: 40px;
        }
        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="converter-box">
        <h2>Video to MP3</h2>
        <p>YouTube වීඩියෝ ලින්ක් එක පහතින් ඇතුළත් කරන්න</p>
        
        <input type="text" id="videoLink" placeholder="https://www.youtube.com/watch?v=...">
        <button onclick="convertVideo()">Convert to MP3</button>
        
        <div id="status-message"></div>
    </div>

    <script>
        async function convertVideo() {
            const videoUrl = document.getElementById("videoLink").value;
            const status = document.getElementById("status-message");
            
            // YouTube ID එක වෙන් කර ගැනීම
            const videoId = getYoutubeID(videoUrl);

            if (!videoId) {
                status.innerHTML = "<span style='color: #ff4d4d;'>කරුණාකර නිවැරදි YouTube ලින්ක් එකක් ඇතුළත් කරන්න!</span>";
                return;
            }

            status.innerHTML = "පරිවර්තනය වෙමින් පවතී... කරුණාකර රැඳී සිටින්න.";
            status.style.color = "#fbc531";

            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': 'b0d9720e6bmsh92fbc195fcfa86ap1ab0afjsnf17af6585b48',
                    'x-rapidapi-host': 'youtube-mp36.p.rapidapi.com'
                }
            };

            try {
                const response = await fetch(`https://youtube-mp36.p.rapidapi.com/dl?id=${videoId}`, options);
                const data = await response.json();

                if (data.status === "ok") {
                    status.innerHTML = `
                        <p style="color: #2ecc71;">සාර්ථකයි! ඔබේ ගොනුව සූදානම්.</p>
                        <a href="${data.link}" class="download-btn" target="_blank">Download MP3</a>
                    `;
                } else {
                    status.innerHTML = "<span style='color: #ff4d4d;'>දෝෂයක් සිදු විය. නැවත උත්සාහ කරන්න.</span>";
                }
            } catch (error) {
                status.innerHTML = "<span style='color: #ff4d4d;'>Server සම්බන්ධතාවයේ ගැටලුවකි!</span>";
                console.error(error);
            }
        }

        function getYoutubeID(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : false;
        }
    </script>

</body>
</html>
